<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #ffffff !important;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
            text-align: center;
        }

        .brand-logo {
            font-family: 'Great Vibes', cursive;
            font-size: 4.5rem;
            color: #1b49b6;
            margin-bottom: 3.5rem;
            font-weight: normal;
        }

        nav {
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
            width: 100%;
            max-width: 300px;
        }

        .nav-link {
            background: none;
            border: none;
            color: #1b49b6;
            font-family: 'Playfair Display', serif;
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: opacity 0.2s ease;
            text-decoration: none;
        }

        .nav-link:hover, .nav-link:active {
            opacity: 0.7;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .modal-content {
            background-color: #ffffff;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            text-align: center;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .modal-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            color: #1b49b6;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .close-btn {
            position: absolute;
            top: 0.8rem;
            right: 1.2rem;
            font-size: 1.5rem;
            color: #888;
            cursor: pointer;
            background: none;
            border: none;
        }

        .modal-body {
            font-family: sans-serif;
            font-size: 0.95rem;
            line-height: 1.6;
            color: #333;
        }
    </style>
</head>
<body>

    <h1 class="brand-logo">Loading...</h1>

    <nav>
        <button class="nav-link" onclick="openModal('shopModal')">SHOP</button>
        <button class="nav-link" onclick="openModal('aboutModal')">ABOUT</button>
        <button class="nav-link" onclick="openModal('contactModal')">CONTACT</button>
        <button class="nav-link" onclick="openModal('sizeModal')">SIZE CHART</button>
        <button class="nav-link" onclick="openModal('privacyModal')">PRIVACY POLICY</button>
    </nav>

    <div id="shopModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal('shopModal')">&times;</button>
            <h2 class="modal-title">SHOP</h2>
            <div class="modal-body"><p>Collection Coming Soon...</p></div>
        </div>
    </div>

    <div id="aboutModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal('aboutModal')">&times;</button>
            <h2 class="modal-title">ABOUT</h2>
            <div class="modal-body"><p>Loading... streetwear brand.</p></div>
        </div>
    </div>

    <div id="contactModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal('contactModal')">&times;</button>
            <h2 class="modal-title">CONTACT</h2>
            <div class="modal-body"><p>Contact us via Instagram or Email.</p></div>
        </div>
    </div>

    <div id="sizeModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal('sizeModal')">&times;</button>
            <h2 class="modal-title">SIZE CHART</h2>
            <div class="modal-body"><p>Oversized streetwear fits.</p></div>
        </div>
    </div>

    <div id="privacyModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal('privacyModal')">&times;</button>
            <h2 class="modal-title">PRIVACY POLICY</h2>
            <div class="modal-body"><p>Your privacy is protected.</p></div>
        </div>
    </div>

    <script>
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        window.onclick = function(event) {
            if (event.target.classList.contains('modal')) { event.target.style.display = 'none'; }
        }
    </script>
</body>
</html>
